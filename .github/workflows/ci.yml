name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rentall
          POSTGRES_PASSWORD: rentall
          POSTGRES_DB: rentall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentall -d rentall_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key
      TEST_DATABASE_URL: postgresql://rentall:rentall@localhost:5432/rentall_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=app --cov-report=term-missing

      - name: Build Docker image
        run: docker build -t rentall:ci .
